# MCPHost Configuration File
# All command-line flags can be configured here
# This demonstrates the simplified local/remote/builtin server configuration

# Application settings
model: "google:gemini-2.5-pro"  # Or "google:gemini-2.0-pro" if you want
max-steps: 20
debug: true

# Model generation parameters
max-tokens: 4096
temperature: 0.7
top-p: 0.95
top-k: 40

# API Configuration
provider-api-key: "GEMINI_TOKEN"

# MCP Servers configuration
mcpServers:
  filesystem_tmp_rw:
    type: "builtin"
    name: "fs"
    options:
      allowed_directories: ["/tmp"]
      allowedTools: ["read_file", "write_file", "list_directory"]
  filesystem_etc_ro:
    type: "builtin"
    name: "fs"
    options:
      allowed_directories: ["/etc"]
      allowedTools: ["read_file", "list_directory"]
  filesystem_urs_etc_ro:
    type: "builtin"
    name: "fs"
    options:
      allowed_directories: ["/usr/etc"]
      allowedTools: ["read_file", "list_directory"]
  filesystem_logs_ro:
    type: "builtin"
    name: "fs"
    options:
      allowed_directories: ["/var/log"]
      allowedTools: ["read_file", "list_directory"]
  filesystem_proc_ro:
    type: "builtin"
    name: "fs"
    options:
      allowed_directories: ["/proc"]
      allowedTools: ["read_file", "list_directory"]

# System Prompt
system-prompt: /home/user/system-prompt.txt
